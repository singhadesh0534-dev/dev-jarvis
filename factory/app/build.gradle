plugins {
    id 'com.android.application'
}

// Filled in by the workflow for each app.
def appId = System.getenv('APP_ID') ?: 'com.adesh.jarvisapp.demo'
def appVersion = (System.getenv('APP_VERSION') ?: '1') as int

android {
    namespace 'com.adesh.jarvisapp'
    compileSdk 35

    defaultConfig {
        applicationId appId
        minSdk 24
        targetSdk 35
        versionCode appVersion
        versionName "1.0.$appVersion"
    }

    signingConfigs {
        // Sir's own signing key (from the JARVIS_KEYSTORE_B64 secret, never in the repo), so a rebuilt app installs
        // over the old one and keeps its data. Without it (self-test) a throwaway key made by the workflow is used.
        release {
            storeFile file(System.getenv('FACTORY_KEYSTORE') ?: 'missing.jks')
            storePassword System.getenv('FACTORY_STORE_PASS') ?: 'jarvis-personal'
            keyAlias System.getenv('FACTORY_KEY_ALIAS') ?: 'jarvis'
            keyPassword System.getenv('FACTORY_KEY_PASS') ?: 'jarvis-personal'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
