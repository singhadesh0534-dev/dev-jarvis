name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK as a release asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runner already has the Android SDK at $ANDROID_HOME.
      - name: Install Android platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Direct phone download, no login / zip:
      # https://github.com/<owner>/<repo>/releases/download/jarvis-latest/JARVIS.apk
      - name: Publish APK to the "jarvis-latest" release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS.apk
          gh release delete jarvis-latest --yes --cleanup-tag || true
          gh release create jarvis-latest JARVIS.apk \
            --title "JARVIS (latest build)" \
            --notes "Auto-built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install JARVIS.apk on the phone." \
            --prerelease \
            --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/
